<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>TapFolio | AR Card Hologram</title>

    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: transparent;
            /* Master dev override applied */
            overflow: hidden;
        }

        #example-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            overflow: hidden;
            z-index: 1;
        }

        #example-container video,
        #example-container canvas {
            position: absolute !important;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) !important;
            min-width: 100vw !important;
            min-height: 100vh !important;
            width: auto !important;
            height: auto !important;
            object-fit: cover !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            z-index: 999;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem 1.5rem;
        }

        .brutalist-btn {
            pointer-events: auto;
            background: #F9CF30;
            color: #111111;
            border: 2px solid #111111;
            box-shadow: 4px 4px 0px 0px #111111;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            text-transform: uppercase;
            padding: 1rem;
            text-align: center;
            transition: all 0.1s;
        }

        .brutalist-btn:active {
            transform: translate(4px, 4px);
            box-shadow: none;
        }
    </style>
</head>

<body>

    <div id="ui-layer">
        <div class="flex justify-between items-start">
            <a href="index.html" class="brutalist-btn" style="padding: 0.5rem 1rem; background: #FFFFFF;">&lt; BACK</a>

            <div class="flex gap-2">
                <div
                    class="text-xs font-mono font-bold text-white bg-black px-2 py-1 border border-[#F9CF30] flex items-center gap-2">
                    SYS_ACTIVE <span class="animate-pulse text-green-500">&#9679;</span>
                </div>
            </div>
        </div>

        <div class="text-center pb-6">
            <p
                class="text-[#F9CF30] font-mono text-sm font-bold bg-black/80 inline-block px-4 py-2 border-2 border-[#F9CF30]">
                [ SCAN TAPFOLIO CARD ]
            </p>
        </div>
    </div>

    <div id="example-container">
        <a-scene
            mindar-image="imageTargetSrc: ./targets.mind; container: #example-container; filterMinCF: 0.1; filterBeta: 10;"
            color-space="sRGB" renderer="colorManagement: true; preserveDrawingBuffer: true; alpha: true;"
            vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

            <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

            <a-entity mindar-image-target="targetIndex: 0">

                <!-- Main Info Card -->
                <a-entity position="0 0 0.1">
                    <a-plane width="1.10" height="0.006" color="#F9CF30" position="0 0.175 0"
                        material="shader: flat"></a-plane>

                    <a-plane width="1.10" height="0.34" color="#000000" position="0 0 -0.005"
                        material="shader: flat; transparent: true; opacity: 0.85"></a-plane>

                    <a-text value="ERMAAN SINGH&#10;TAPFOLIO ARCHITECT" color="#F9CF30" align="left" width="0.82"
                        wrap-count="24" position="-0.50 0.08 0" font="monoid" material="shader: flat"></a-text>

                    <a-plane width="0.004" height="0.22" color="#F9CF30" position="0.08 0 0"
                        material="shader: flat; transparent: true; opacity: 0.5"></a-plane>

                    <a-text value="LOCAL LLM&#10;OWASP TOP 10 | C++ / PY" color="#FFFFFF" align="left" width="0.76"
                        wrap-count="24" position="0.12 0.08 0" font="monoid" material="shader: flat"></a-text>

                    <a-text value="4.0 GPA  //  CLEARANCE: ADMIN  //  CYBER DEFENSE" color="#888888" align="center"
                        width="0.88" wrap-count="34" position="0 -0.12 0" font="monoid"
                        material="shader: flat"></a-text>

                    <a-plane width="1.10" height="0.004" color="#333333" position="0 -0.172 0"
                        material="shader: flat"></a-plane>
                </a-entity>

                <!-- Corner Framing Brackets -->
                <a-entity position="0 0 0.05">
                    <a-plane width="0.1" height="0.01" color="#F9CF30" position="-0.45 0.7 0"
                        material="shader: flat"></a-plane>
                    <a-plane width="0.01" height="0.1" color="#F9CF30" position="-0.5 0.65 0"
                        material="shader: flat"></a-plane>
                    <a-plane width="0.1" height="0.01" color="#F9CF30" position="0.45 0.7 0"
                        material="shader: flat"></a-plane>
                    <a-plane width="0.01" height="0.1" color="#F9CF30" position="0.5 0.65 0"
                        material="shader: flat"></a-plane>
                    <a-plane width="0.1" height="0.01" color="#F9CF30" position="-0.45 -0.7 0"
                        material="shader: flat"></a-plane>
                    <a-plane width="0.01" height="0.1" color="#F9CF30" position="-0.5 -0.65 0"
                        material="shader: flat"></a-plane>
                    <a-plane width="0.1" height="0.01" color="#F9CF30" position="0.45 -0.7 0"
                        material="shader: flat"></a-plane>
                    <a-plane width="0.01" height="0.1" color="#F9CF30" position="0.5 -0.65 0"
                        material="shader: flat"></a-plane>
                </a-entity>

            </a-entity>
        </a-scene>
    </div>
</body>

</html>
