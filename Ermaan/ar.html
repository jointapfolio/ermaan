<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>TapFolio | Cyber-HUD</title>

    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-face-aframe.prod.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent;
        }

        /* MANDATORY MINDAR STRUCTURE: The container that holds the scene */
        #example-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* FIX: MindAR injects a raw <video> element with its native camera
           resolution (e.g. 1280x720). Without this, the video renders at
           its intrinsic aspect ratio inside the full-screen container,
           leaving black letterbox bars top/bottom. This makes it behave
           like CSS `object-fit: cover` — fill the screen, crop overflow,
           no stretching. */
        #example-container video {
            position: absolute !important;
            top: 50% !important;
            left: 50% !important;
            width: auto !important;
            height: auto !important;
            min-width: 100% !important;
            min-height: 100% !important;
            transform: translate(-50%, -50%) !important;
            object-fit: cover;
        }

        /* The three.js/A-Frame canvas (the HUD layer) should always match
           the container exactly so it lines up with the cropped video. */
        #example-container canvas {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            z-index: 999;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem 1.5rem;
        }

        .brutalist-btn {
            pointer-events: auto;
            background: #F9CF30;
            color: #111111;
            border: 2px solid #111111;
            box-shadow: 4px 4px 0px 0px #111111;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            text-transform: uppercase;
            padding: 1rem;
            text-align: center;
            transition: all 0.1s;
        }

        .brutalist-btn:active {
            transform: translate(4px, 4px);
            box-shadow: none;
        }
    </style>
</head>

<body>

    <div id="ui-layer">
        <div class="flex justify-between items-start">
            <a href="index.html" class="brutalist-btn" style="padding: 0.5rem 1rem; background: #FFFFFF;">&lt; BACK</a>

            <div class="flex gap-2">
                <button onclick="flipCamera()" class="brutalist-btn" style="padding: 0.5rem; background: #FFFFFF;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 2v6h-6" />
                        <path d="M3 12a9 9 0 0 1 15-6.7L21 8" />
                        <path d="M3 22v-6h6" />
                        <path d="M21 12a9 9 0 0 1-15 6.7L3 16" />
                    </svg>
                </button>
                <div
                    class="text-xs font-mono font-bold text-white bg-black px-2 py-1 border border-[#F9CF30] flex items-center gap-2">
                    REC <span class="animate-pulse text-red-500">●</span>
                </div>
            </div>
        </div>

        <div class="text-center">
            <button onclick="captureHUD()" class="brutalist-btn w-full max-w-sm mx-auto">
                [ CAPTURE HUD RECORD ]
            </button>
            <p class="text-[#F9CF30] font-mono text-xs mt-3 font-bold bg-black/50 inline-block px-2"
                id="cam-instruction">
                POINT CAMERA AT ERMAAN
            </p>
        </div>
    </div>

    <div id="flash"
        class="fixed inset-0 bg-white opacity-0 z-[1000] pointer-events-none transition-opacity duration-150"></div>

    <!-- MANDATORY MINDAR STRUCTURE: The wrapper div -->
    <div id="example-container">
        <script>
            const urlParams = new URLSearchParams(window.location.search);
            const camMode = urlParams.get('cam') === 'environment' ? 'environment' : 'user';

            document.write(`
        <a-scene 
          mindar-face="facingMode: ${camMode};" 
          embedded 
          color-space="sRGB" 
          renderer="colorManagement: true; preserveDrawingBuffer: true; alpha: true;" 
          vr-mode-ui="enabled: false" 
          device-orientation-permission-ui="enabled: false">
      `);
        </script>

        <a-camera active="false" position="0 0 0"></a-camera>

        <a-entity mindar-face-target="anchorIndex: 1">

            <!-- Cyber-Bracket -->
            <a-entity position="-0.3 0.35 0">
                <a-plane width="0.1" height="0.01" color="#F9CF30" position="0.05 0 0"
                    material="shader: flat"></a-plane>
                <a-plane width="0.01" height="0.1" color="#F9CF30" position="0 -0.05 0"
                    material="shader: flat"></a-plane>
            </a-entity>
            <a-entity position="0.3 0.35 0">
                <a-plane width="0.1" height="0.01" color="#F9CF30" position="-0.05 0 0"
                    material="shader: flat"></a-plane>
                <a-plane width="0.01" height="0.1" color="#F9CF30" position="0 -0.05 0"
                    material="shader: flat"></a-plane>
            </a-entity>
            <a-entity position="-0.3 -0.35 0">
                <a-plane width="0.1" height="0.01" color="#F9CF30" position="0.05 0 0"
                    material="shader: flat"></a-plane>
                <a-plane width="0.01" height="0.1" color="#F9CF30" position="0 0.05 0"
                    material="shader: flat"></a-plane>
            </a-entity>
            <a-entity position="0.3 -0.35 0">
                <a-plane width="0.1" height="0.01" color="#F9CF30" position="-0.05 0 0"
                    material="shader: flat"></a-plane>
                <a-plane width="0.01" height="0.1" color="#F9CF30" position="0 0.05 0"
                    material="shader: flat"></a-plane>
            </a-entity>

            <!-- Left Panel: dark plaque behind the text is what actually
                 makes it readable over skin/hair/background. Bumped the
                 text `width` up and added `wrap-count` so characters render
                 bigger instead of a tiny wall of text. -->
            <a-entity position="-0.62 0.05 0.08">
                <a-plane width="0.62" height="0.34" color="#000000" position="0 0 -0.01"
                    material="shader: flat; transparent: true; opacity: 0.55"></a-plane>
                <a-text value="SYS_SKILLS:\n> INFO SEC\n> CYBER DEF\n> C++ / PYTHON\n> WIRESHARK" color="#FFFFFF"
                    align="right" width="0.9" wrap-count="16" position="0.28 0.1 0" font="monoid"
                    material="shader: flat"></a-text>
                <a-plane width="0.3" height="0.008" color="#F9CF30" position="-0.15 -0.15 0"
                    material="shader: flat"></a-plane>
            </a-entity>

            <!-- Right Panel -->
            <a-entity position="0.62 0.05 0.08">
                <a-plane width="0.62" height="0.34" color="#000000" position="0 0 -0.01"
                    material="shader: flat; transparent: true; opacity: 0.55"></a-plane>
                <a-text value="ID: ERMAAN SINGH\nSTATUS: 4.0 GPA\nROLE: IT STUDENT\nCLEARANCE: INTERN" color="#F9CF30"
                    align="left" width="0.9" wrap-count="16" position="-0.28 0.1 0" font="monoid"
                    material="shader: flat"></a-text>
                <a-plane width="0.3" height="0.008" color="#FFFFFF" position="0.15 -0.15 0"
                    material="shader: flat"></a-plane>
            </a-entity>

        </a-entity>
        </a-scene>
    </div> <!-- End wrapper div -->

    <script>
        function flipCamera() {
            const url = new URL(window.location.href);
            const currentCam = url.searchParams.get('cam') || 'user';
            url.searchParams.set('cam', currentCam === 'user' ? 'environment' : 'user');
            url.searchParams.set('v', Date.now());
            window.location.replace(url.toString());
        }

        window.onload = () => {
            const camInstruction = document.getElementById('cam-instruction');
            if (typeof camMode !== 'undefined' && camMode === 'user') {
                camInstruction.innerText = "SELFIE MODE ALIGNED";
            } else {
                camInstruction.innerText = "SCAN TARGET: ERMAAN";
            }
        };

        function captureHUD() {
            const video = document.querySelector('#example-container video');
            const sceneEl = document.querySelector('a-scene');

            if (!video || !sceneEl || !sceneEl.components.screenshot) return;

            const flash = document.getElementById('flash');
            flash.style.opacity = '1';
            setTimeout(() => { flash.style.opacity = '0'; }, 150);

            // Force synchronous render first, so the HUD frame we grab
            // below is fresh (not a stale/blank buffer).
            sceneEl.renderer.render(sceneEl.object3D, sceneEl.camera);
            const aframeCanvas = sceneEl.components.screenshot.getCanvas('perspective');
            if (!aframeCanvas) return;

            // FIX: output at the size the user actually SEES on screen
            // (the container), not the video's native camera resolution.
            // This is what the aframe canvas is already sized to, so the
            // two layers line up 1:1.
            const rect = document.getElementById('example-container').getBoundingClientRect();
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            const finalCanvas = document.createElement('canvas');
            finalCanvas.width = Math.round(rect.width * dpr);
            finalCanvas.height = Math.round(rect.height * dpr);
            const ctx = finalCanvas.getContext('2d');

            const isSelfie = (typeof camMode !== 'undefined' && camMode === 'user');

            // FIX: replicate the CSS `object-fit: cover` crop math manually
            // when drawing the video into the canvas, instead of stretching
            // the raw video to fill a differently-proportioned canvas.
            const vw = video.videoWidth || 1280;
            const vh = video.videoHeight || 720;
            const cw = finalCanvas.width;
            const ch = finalCanvas.height;
            const videoRatio = vw / vh;
            const canvasRatio = cw / ch;

            let sx, sy, sw, sh;
            if (videoRatio > canvasRatio) {
                // Video is relatively wider than the screen -> crop left/right
                sh = vh;
                sw = vh * canvasRatio;
                sx = (vw - sw) / 2;
                sy = 0;
            } else {
                // Video is relatively taller than the screen -> crop top/bottom
                sw = vw;
                sh = vw / canvasRatio;
                sx = 0;
                sy = (vh - sh) / 2;
            }

            ctx.save();
            if (isSelfie) {
                ctx.translate(cw, 0);
                ctx.scale(-1, 1);
            }
            ctx.drawImage(video, sx, sy, sw, sh, 0, 0, cw, ch);
            ctx.restore();

            // Draw the AR HUD layer on top — already matches the container's
            // aspect ratio, so no distortion here.
            ctx.drawImage(aframeCanvas, 0, 0, cw, ch);

            // Save File
            const link = document.createElement('a');
            link.download = 'TapFolio-Clearance-Record.png';
            link.href = finalCanvas.toDataURL('image/png', 1.0);
            link.click();
        }
    </script>
</body>

</html>
