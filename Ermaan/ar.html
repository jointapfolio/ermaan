<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>TapFolio | Cyber-HUD</title>

    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-face-aframe.prod.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent;
        }

        /* MANDATORY MINDAR STRUCTURE: The container that holds the scene */
        #example-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            z-index: 999;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem 1.5rem;
        }

        .brutalist-btn {
            pointer-events: auto;
            background: #F9CF30;
            color: #111111;
            border: 2px solid #111111;
            box-shadow: 4px 4px 0px 0px #111111;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            text-transform: uppercase;
            padding: 1rem;
            text-align: center;
            transition: all 0.1s;
        }

        .brutalist-btn:active {
            transform: translate(4px, 4px);
            box-shadow: none;
        }
    </style>
</head>

<body>

    <div id="ui-layer">
        <div class="flex justify-between items-start">
            <a href="index.html" class="brutalist-btn" style="padding: 0.5rem 1rem; background: #FFFFFF;">&lt; BACK</a>

            <div class="flex gap-2">
                <button onclick="flipCamera()" class="brutalist-btn" style="padding: 0.5rem; background: #FFFFFF;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 2v6h-6" />
                        <path d="M3 12a9 9 0 0 1 15-6.7L21 8" />
                        <path d="M3 22v-6h6" />
                        <path d="M21 12a9 9 0 0 1-15 6.7L3 16" />
                    </svg>
                </button>
                <div
                    class="text-xs font-mono font-bold text-white bg-black px-2 py-1 border border-[#F9CF30] flex items-center gap-2">
                    REC <span class="animate-pulse text-red-500">●</span>
                </div>
            </div>
        </div>

        <div class="text-center">
            <button onclick="captureHUD()" class="brutalist-btn w-full max-w-sm mx-auto">
                [ CAPTURE HUD RECORD ]
            </button>
            <p class="text-[#F9CF30] font-mono text-xs mt-3 font-bold bg-black/50 inline-block px-2"
                id="cam-instruction">
                POINT CAMERA AT ERMAAN
            </p>
        </div>
    </div>

    <div id="flash"
        class="fixed inset-0 bg-white opacity-0 z-[1000] pointer-events-none transition-opacity duration-150"></div>

    <!-- MANDATORY MINDAR STRUCTURE: The wrapper div -->
    <div id="example-container">
        <script>
            const urlParams = new URLSearchParams(window.location.search);
            const camMode = urlParams.get('cam') === 'environment' ? 'environment' : 'user';

            document.write(`
        <a-scene 
          mindar-face="facingMode: ${camMode};" 
          embedded 
          color-space="sRGB" 
          renderer="colorManagement: true; preserveDrawingBuffer: true; alpha: true;" 
          vr-mode-ui="enabled: false" 
          device-orientation-permission-ui="enabled: false">
      `);
        </script>

        <a-camera active="false" position="0 0 0"></a-camera>

        <a-entity mindar-face-target="anchorIndex: 1">

            <!-- Cyber-Bracket -->
            <a-entity position="-0.3 0.35 0">
                <a-plane width="0.1" height="0.01" color="#F9CF30" position="0.05 0 0"
                    material="shader: flat"></a-plane>
                <a-plane width="0.01" height="0.1" color="#F9CF30" position="0 -0.05 0"
                    material="shader: flat"></a-plane>
            </a-entity>
            <a-entity position="0.3 0.35 0">
                <a-plane width="0.1" height="0.01" color="#F9CF30" position="-0.05 0 0"
                    material="shader: flat"></a-plane>
                <a-plane width="0.01" height="0.1" color="#F9CF30" position="0 -0.05 0"
                    material="shader: flat"></a-plane>
            </a-entity>
            <a-entity position="-0.3 -0.35 0">
                <a-plane width="0.1" height="0.01" color="#F9CF30" position="0.05 0 0"
                    material="shader: flat"></a-plane>
                <a-plane width="0.01" height="0.1" color="#F9CF30" position="0 0.05 0"
                    material="shader: flat"></a-plane>
            </a-entity>
            <a-entity position="0.3 -0.35 0">
                <a-plane width="0.1" height="0.01" color="#F9CF30" position="-0.05 0 0"
                    material="shader: flat"></a-plane>
                <a-plane width="0.01" height="0.1" color="#F9CF30" position="0 0.05 0"
                    material="shader: flat"></a-plane>
            </a-entity>

            <!-- Left Panel -->
            <a-entity position="-0.55 0 0.1">
                <a-text value="SYS_SKILLS:\n> INFO SEC\n> CYBER DEFENSE\n> C++ / PYTHON\n> WIRESHARK" color="#FFFFFF"
                    align="right" width="1.4" position="0 0.15 0" font="monoid" material="shader: flat"></a-text>
                <a-plane width="0.25" height="0.005" color="#FFFFFF" position="0.15 0 0"
                    material="shader: flat; transparent: true; opacity: 0.5"></a-plane>
                <a-plane width="0.5" height="0.015" color="#F9CF30" position="-0.25 -0.2 0"
                    material="shader: flat; transparent: true; opacity: 0.8"></a-plane>
            </a-entity>

            <!-- Right Panel -->
            <a-entity position="0.55 0 0.1">
                <a-text value="ID: ERMAAN SINGH\nSTATUS: 4.0 GPA\nROLE: IT STUDENT\nCLEARANCE: INTERN" color="#F9CF30"
                    align="left" width="1.4" position="0 0.15 0" font="monoid" material="shader: flat"></a-text>
                <a-plane width="0.25" height="0.005" color="#FFFFFF" position="-0.15 0 0"
                    material="shader: flat; transparent: true; opacity: 0.5"></a-plane>
                <a-plane width="0.5" height="0.015" color="#FFFFFF" position="0.25 -0.2 0"
                    material="shader: flat; transparent: true; opacity: 0.8"></a-plane>
            </a-entity>

        </a-entity>
        </a-scene>
    </div> <!-- End wrapper div -->

    <script>
        function flipCamera() {
            const url = new URL(window.location.href);
            const currentCam = url.searchParams.get('cam') || 'user';
            url.searchParams.set('cam', currentCam === 'user' ? 'environment' : 'user');
            url.searchParams.set('v', Date.now());
            window.location.replace(url.toString());
        }

        window.onload = () => {
            const camInstruction = document.getElementById('cam-instruction');
            if (typeof camMode !== 'undefined' && camMode === 'user') {
                camInstruction.innerText = "SELFIE MODE ALIGNED";
            } else {
                camInstruction.innerText = "SCAN TARGET: ERMAAN";
            }
        };

        function captureHUD() {
            const video = document.querySelector('video');
            const sceneEl = document.querySelector('a-scene');

            if (!video || !sceneEl) return;

            const flash = document.getElementById('flash');
            flash.style.opacity = '1';
            setTimeout(() => { flash.style.opacity = '0'; }, 150);

            // Extract the 3D layer natively
            const aframeCanvas = sceneEl.components.screenshot.getCanvas('perspective');
            if (!aframeCanvas) return;

            // Because the layout is now correct, we can use the canvas dimensions directly
            const finalCanvas = document.createElement('canvas');
            finalCanvas.width = aframeCanvas.width;
            finalCanvas.height = aframeCanvas.height;
            const ctx = finalCanvas.getContext('2d');

            const isSelfie = (typeof camMode !== 'undefined' && camMode === 'user');

            // Draw Video (Flipped horizontally if it's a selfie)
            ctx.save();
            if (isSelfie) {
                ctx.translate(finalCanvas.width, 0);
                ctx.scale(-1, 1);
            }
            // Draw the video filling the canvas
            ctx.drawImage(video, 0, 0, finalCanvas.width, finalCanvas.height);
            ctx.restore();

            // Force synchronous render to ensure HUD isn't blank
            sceneEl.renderer.render(sceneEl.object3D, sceneEl.camera);

            // Draw the AR elements directly over the video
            ctx.drawImage(aframeCanvas, 0, 0, finalCanvas.width, finalCanvas.height);

            // Save File
            const link = document.createElement('a');
            link.download = 'TapFolio-Clearance-Record.png';
            link.href = finalCanvas.toDataURL('image/png', 1.0);
            link.click();
        }
    </script>
</body>

</html>
