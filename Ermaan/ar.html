<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>TapFolio | Cyber-HUD</title>

    <!-- A-Frame & MindAR Face Tracking Libraries -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-face-aframe.prod.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111111;
        }

        /* Custom UI Overlay over the Camera */
        #ui-layer {
            position: absolute;
            inset: 0;
            z-index: 999;
            pointer-events: none;
            /* Lets A-frame handle touches if needed */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem 1.5rem;
        }

        .brutalist-btn {
            pointer-events: auto;
            background: #F9CF30;
            /* Charizard Yellow */
            color: #111111;
            border: 2px solid #111111;
            box-shadow: 4px 4px 0px 0px #111111;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            text-transform: uppercase;
            padding: 1rem;
            text-align: center;
            transition: all 0.1s;
        }

        .brutalist-btn:active {
            transform: translate(4px, 4px);
            box-shadow: none;
        }
    </style>
</head>

<body>

    <!-- UI Overlay -->
    <div id="ui-layer">
        <div class="flex justify-between items-start">
            <a href="index.html" class="brutalist-btn" style="padding: 0.5rem 1rem; background: #FFFFFF;">&lt; BACK</a>
            <div class="text-xs font-mono font-bold text-white bg-black px-2 py-1 border border-[#F9CF30]">REC <span
                    class="animate-pulse text-red-500">●</span></div>
        </div>

        <div class="text-center">
            <button onclick="captureHUD()" class="brutalist-btn w-full max-w-sm mx-auto">
                [ CAPTURE HUD RECORD ]
            </button>
            <p class="text-[#F9CF30] font-mono text-xs mt-3 font-bold bg-black/50 inline-block px-2">POINT CAMERA AT
                ERMAAN'S FACE</p>
        </div>
    </div>

    <!-- Screen Flash Effect for Capture -->
    <div id="flash"
        class="fixed inset-0 bg-white opacity-0 z-[1000] pointer-events-none transition-opacity duration-150"></div>

    <!-- AR Scene -->
    <a-scene mindar-face embedded color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights"
        vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

        <a-camera active="false" position="0 0 0"></a-camera>

        <!-- Face Anchor (Index 1 is the bridge of the nose) -->
        <a-entity mindar-face-target="anchorIndex: 1">

            <!-- Outer Spinning Ring -->
            <a-ring radius-inner="0.75" radius-outer="0.77" color="#F9CF30"
                material="shader: flat; transparent: true; opacity: 0.8"
                animation="property: rotation; to: 0 0 360; dur: 10000; loop: true; easing: linear"></a-ring>

            <!-- Inner Dashed Ring -->
            <a-ring radius-inner="0.65" radius-outer="0.7" color="#FFFFFF"
                material="shader: flat; transparent: true; opacity: 0.4" theta-length="280"
                animation="property: rotation; to: 0 0 -360; dur: 6000; loop: true; easing: linear"></a-ring>

            <!-- Center Crosshair over the nose -->
            <a-entity position="0 0 0">
                <a-plane width="0.04" height="0.01" color="#F9CF30" position="-0.1 0 0"
                    material="shader: flat"></a-plane>
                <a-plane width="0.04" height="0.01" color="#F9CF30" position="0.1 0 0"
                    material="shader: flat"></a-plane>
                <a-plane width="0.01" height="0.04" color="#F9CF30" position="0 -0.1 0"
                    material="shader: flat"></a-plane>
                <a-plane width="0.01" height="0.04" color="#F9CF30" position="0 0.1 0"
                    material="shader: flat"></a-plane>
            </a-entity>

            <!-- LEFT PANEL: Technical Skills -->
            <a-entity position="-0.9 0 0.1">
                <a-text value="SYS_SKILLS:\n> INFO SEC\n> CYBER DEFENSE\n> C++ / PYTHON\n> WIRESHARK" color="#FFFFFF"
                    align="right" width="2.5" position="0 0.2 0" font="monoid" material="shader: flat"></a-text>
                <a-plane width="0.8" height="0.02" color="#F9CF30" position="-0.4 -0.3 0"
                    material="shader: flat; transparent: true; opacity: 0.8"></a-plane>
            </a-entity>

            <!-- RIGHT PANEL: Clearances & Stats -->
            <a-entity position="0.9 0 0.1">
                <a-text value="ID: ERMAAN SINGH\nSTATUS: 4.0 GPA\nROLE: IT STUDENT\nCLEARANCE: INTERN" color="#F9CF30"
                    align="left" width="2.5" position="0 0.2 0" font="monoid" material="shader: flat"></a-text>
                <a-plane width="0.8" height="0.02" color="#FFFFFF" position="0.4 -0.3 0"
                    material="shader: flat; transparent: true; opacity: 0.8"></a-plane>
            </a-entity>

        </a-entity>
    </a-scene>

    <!-- Capture Logic -->
    <script>
        function captureHUD() {
            // 1. Flash effect
            const flash = document.getElementById('flash');
            flash.style.opacity = '1';

            // 2. We use a slight delay so the flash hits before the JS freezes to capture
            setTimeout(() => {
                flash.style.opacity = '0';

                // 3. Since saving a WebGL canvas + Video feed natively in JS is complex on mobile, 
                // the standard MVP method is to trigger the native mobile share/save sheet, 
                // or prompt the user to use their hardware buttons while the UI hides.

                // Hide UI for a clean screenshot
                document.getElementById('ui-layer').style.display = 'none';

                alert("HUD LOCKED. \nUse your phone's screenshot buttons now to capture the record!");

                // Bring UI back after 4 seconds
                setTimeout(() => {
                    document.getElementById('ui-layer').style.display = 'flex';
                }, 4000);

            }, 150);
        }
    </script>
</body>

</html>
