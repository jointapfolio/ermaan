<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>TapFolio | Cyber-HUD</title>

    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-face-aframe.prod.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* Fixes the white bars and forces absolute full-screen coverage */
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent;
        }

        /* Forces both the camera feed and the AR graphics to fill the screen perfectly */
        video,
        canvas {
            width: 100vw !important;
            height: 100vh !important;
            object-fit: cover !important;
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            z-index: 999;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem 1.5rem;
        }

        .brutalist-btn {
            pointer-events: auto;
            background: #F9CF30;
            color: #111111;
            border: 2px solid #111111;
            box-shadow: 4px 4px 0px 0px #111111;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            text-transform: uppercase;
            padding: 1rem;
            text-align: center;
            transition: all 0.1s;
        }

        .brutalist-btn:active {
            transform: translate(4px, 4px);
            box-shadow: none;
        }
    </style>
</head>

<body>

    <!-- UI Overlay -->
    <div id="ui-layer">
        <div class="flex justify-between items-start">
            <a href="index.html" class="brutalist-btn" style="padding: 0.5rem 1rem; background: #FFFFFF;">&lt; BACK</a>

            <div class="flex gap-2">
                <!-- New Flip Camera Button -->
                <button onclick="flipCamera()" class="brutalist-btn" style="padding: 0.5rem; background: #FFFFFF;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 2v6h-6" />
                        <path d="M3 12a9 9 0 0 1 15-6.7L21 8" />
                        <path d="M3 22v-6h6" />
                        <path d="M21 12a9 9 0 0 1-15 6.7L3 16" />
                    </svg>
                </button>
                <div
                    class="text-xs font-mono font-bold text-white bg-black px-2 py-1 border border-[#F9CF30] flex items-center gap-2">
                    REC <span class="animate-pulse text-red-500">●</span>
                </div>
            </div>
        </div>

        <div class="text-center">
            <button onclick="captureHUD()" class="brutalist-btn w-full max-w-sm mx-auto">
                [ CAPTURE HUD RECORD ]
            </button>
            <p class="text-[#F9CF30] font-mono text-xs mt-3 font-bold bg-black/50 inline-block px-2"
                id="cam-instruction">
                POINT CAMERA AT ERMAAN
            </p>
        </div>
    </div>

    <div id="flash"
        class="fixed inset-0 bg-white opacity-0 z-[1000] pointer-events-none transition-opacity duration-150"></div>

    <!-- Dynamic Scene Injection (Handles Camera Flipping) -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        // Defaults to selfie (user) camera, switches to back (environment) if requested
        const camMode = urlParams.get('cam') === 'environment' ? 'environment' : 'user';

        document.write(`
      <a-scene 
        mindar-face="facingMode: ${camMode};" 
        embedded 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights, preserveDrawingBuffer: true, alpha: true" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
    `);
    </script>

    <a-camera active="false" position="0 0 0"></a-camera>

    <!-- Face Anchor -->
    <a-entity mindar-face-target="anchorIndex: 1">

        <a-ring radius-inner="0.75" radius-outer="0.77" color="#F9CF30"
            material="shader: flat; transparent: true; opacity: 0.8"
            animation="property: rotation; to: 0 0 360; dur: 10000; loop: true; easing: linear"></a-ring>

        <a-ring radius-inner="0.65" radius-outer="0.7" color="#FFFFFF"
            material="shader: flat; transparent: true; opacity: 0.4" theta-length="280"
            animation="property: rotation; to: 0 0 -360; dur: 6000; loop: true; easing: linear"></a-ring>

        <a-entity position="0 0 0">
            <a-plane width="0.04" height="0.01" color="#F9CF30" position="-0.1 0 0" material="shader: flat"></a-plane>
            <a-plane width="0.04" height="0.01" color="#F9CF30" position="0.1 0 0" material="shader: flat"></a-plane>
            <a-plane width="0.01" height="0.04" color="#F9CF30" position="0 -0.1 0" material="shader: flat"></a-plane>
            <a-plane width="0.01" height="0.04" color="#F9CF30" position="0 0.1 0" material="shader: flat"></a-plane>
        </a-entity>

        <!-- Skills Panel -->
        <a-entity position="-0.9 0 0.1">
            <a-text value="SYS_SKILLS:\n> INFO SEC\n> CYBER DEFENSE\n> C++ / PYTHON\n> WIRESHARK" color="#FFFFFF"
                align="right" width="2.5" position="0 0.2 0" font="monoid" material="shader: flat"></a-text>
            <a-plane width="0.8" height="0.02" color="#F9CF30" position="-0.4 -0.3 0"
                material="shader: flat; transparent: true; opacity: 0.8"></a-plane>
        </a-entity>

        <!-- Stats Panel -->
        <a-entity position="0.9 0 0.1">
            <a-text value="ID: ERMAAN SINGH\nSTATUS: 4.0 GPA\nROLE: IT STUDENT\nCLEARANCE: INTERN" color="#F9CF30"
                align="left" width="2.5" position="0 0.2 0" font="monoid" material="shader: flat"></a-text>
            <a-plane width="0.8" height="0.02" color="#FFFFFF" position="0.4 -0.3 0"
                material="shader: flat; transparent: true; opacity: 0.8"></a-plane>
        </a-entity>

    </a-entity>
    </a-scene>

    <script>
        // 1. FLIP CAMERA LOGIC
        function flipCamera() {
            const currentUrl = new URL(window.location.href);
            const currentCam = currentUrl.searchParams.get('cam');

            if (currentCam === 'environment') {
                currentUrl.searchParams.set('cam', 'user');
            } else {
                currentUrl.searchParams.set('cam', 'environment');
            }
            window.location.href = currentUrl.toString();
        }

        // Update text instruction based on camera mode
        window.onload = () => {
            const camInstruction = document.getElementById('cam-instruction');
            if (camMode === 'user') {
                camInstruction.innerText = "SELFIE MODE ALIGNED";
            } else {
                camInstruction.innerText = "SCAN TARGET: ERMAAN";
            }
        };

        // 2. CAPTURE LOGIC (MERGING VIDEO + 3D CANVAS)
        function captureHUD() {
            const video = document.querySelector('video');
            const aframeCanvas = document.querySelector('canvas.a-canvas');

            if (!video || !aframeCanvas) {
                alert("HUD is still calibrating. Please wait a second.");
                return;
            }

            // Flash Screen Effect
            const flash = document.getElementById('flash');
            flash.style.opacity = '1';
            setTimeout(() => { flash.style.opacity = '0'; }, 150);

            // Create a hidden canvas to combine both layers
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = video.videoWidth || window.innerWidth;
            tempCanvas.height = video.videoHeight || window.innerHeight;
            const ctx = tempCanvas.getContext('2d');

            // Draw the live video feed first
            ctx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);

            // Draw the 3D AR holograms on top of it
            ctx.drawImage(aframeCanvas, 0, 0, tempCanvas.width, tempCanvas.height);

            // Trigger automatic download
            const link = document.createElement('a');
            link.download = 'TapFolio-Clearance-Record.png';
            link.href = tempCanvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>

</html>
