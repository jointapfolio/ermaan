<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>TapFolio | AR Card Hologram</title>

    <!-- Swapped to the Image Tracking Library -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: transparent;
            overflow: hidden;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            z-index: 999;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem 1.5rem;
        }

        .brutalist-btn {
            pointer-events: auto;
            background: #F9CF30;
            color: #111111;
            border: 2px solid #111111;
            box-shadow: 4px 4px 0px 0px #111111;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            text-transform: uppercase;
            padding: 1rem;
            text-align: center;
            transition: all 0.1s;
        }

        .brutalist-btn:active {
            transform: translate(4px, 4px);
            box-shadow: none;
        }
    </style>
</head>

<body>

    <div id="ui-layer">
        <div class="flex justify-between items-start">
            <a href="index.html" class="brutalist-btn" style="padding: 0.5rem 1rem; background: #FFFFFF;">&lt; BACK</a>

            <div class="flex gap-2">
                <div
                    class="text-xs font-mono font-bold text-white bg-black px-2 py-1 border border-[#F9CF30] flex items-center gap-2">
                    LINK <span class="animate-pulse text-green-500">&#9679;</span>
                </div>
            </div>
        </div>

        <div class="text-center">
            <button onclick="captureHUD()" class="brutalist-btn w-full max-w-sm mx-auto">
                [ CAPTURE HOLOGRAM ]
            </button>
            <p class="text-[#F9CF30] font-mono text-xs mt-3 font-bold bg-black/50 inline-block px-2">
                SCAN TAPFOLIO CARD
            </p>
        </div>
    </div>

    <div id="flash"
        class="fixed inset-0 bg-white opacity-0 z-[1000] pointer-events-none transition-opacity duration-150"></div>

    <!-- 
      The AR Scene. It looks for the targets.mind file we generated.
    -->
    <a-scene mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.1; filterBeta: 10;" color-space="sRGB"
        renderer="colorManagement: true; preserveDrawingBuffer: true; alpha: true;" vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- The targetIndex: 0 attaches the graphics to the first image in the compiled .mind file -->
        <a-entity mindar-image-target="targetIndex: 0">

            <!-- THE HOLOGRAM: This will hover exactly over the physical card -->
            <!-- We elevate it slightly on the Z axis (0.1) so it floats above the paper -->
            <a-entity position="0 0 0.1">

                <!-- Gold Accent Bar -->
                <a-plane width="1.10" height="0.006" color="#F9CF30" position="0 0.175 0"
                    material="shader: flat"></a-plane>

                <!-- Semi-transparent backing so the physical card circuits show underneath -->
                <a-plane width="1.10" height="0.34" color="#000000" position="0 0 -0.005"
                    material="shader: flat; transparent: true; opacity: 0.85"></a-plane>

                <!-- Left Section: Identity -->
                <a-text value="ERMAAN SINGH&#10;TAPFOLIO ARCHITECT" color="#F9CF30" align="left" width="0.82"
                    wrap-count="24" position="-0.50 0.08 0" font="monoid" material="shader: flat"></a-text>

                <!-- Vertical Divider -->
                <a-plane width="0.004" height="0.22" color="#F9CF30" position="0.08 0 0"
                    material="shader: flat; transparent: true; opacity: 0.5"></a-plane>

                <!-- Right Section: Skills -->
                <a-text value="API SECURITY | LOCAL LLM&#10;OWASP TOP 10 | C++ / PY" color="#FFFFFF" align="left"
                    width="0.76" wrap-count="24" position="0.12 0.08 0" font="monoid" material="shader: flat"></a-text>

                <!-- Bottom Metadata -->
                <a-text value="4.0 GPA  //  CLEARANCE: ADMIN  //  CYBER DEFENSE" color="#888888" align="center"
                    width="0.88" wrap-count="34" position="0 -0.12 0" font="monoid" material="shader: flat"></a-text>

                <!-- Bottom Border Strip -->
                <a-plane width="1.10" height="0.004" color="#333333" position="0 -0.172 0"
                    material="shader: flat"></a-plane>

            </a-entity>

            <!-- Tech-styled scanning bracket that frames the physical card -->
            <a-entity position="0 0 0.05">
                <!-- Top Left -->
                <a-plane width="0.1" height="0.01" color="#F9CF30" position="-0.45 0.7 0"
                    material="shader: flat"></a-plane>
                <a-plane width="0.01" height="0.1" color="#F9CF30" position="-0.5 0.65 0"
                    material="shader: flat"></a-plane>
                <!-- Top Right -->
                <a-plane width="0.1" height="0.01" color="#F9CF30" position="0.45 0.7 0"
                    material="shader: flat"></a-plane>
                <a-plane width="0.01" height="0.1" color="#F9CF30" position="0.5 0.65 0"
                    material="shader: flat"></a-plane>
                <!-- Bottom Left -->
                <a-plane width="0.1" height="0.01" color="#F9CF30" position="-0.45 -0.7 0"
                    material="shader: flat"></a-plane>
                <a-plane width="0.01" height="0.1" color="#F9CF30" position="-0.5 -0.65 0"
                    material="shader: flat"></a-plane>
                <!-- Bottom Right -->
                <a-plane width="0.1" height="0.01" color="#F9CF30" position="0.45 -0.7 0"
                    material="shader: flat"></a-plane>
                <a-plane width="0.01" height="0.1" color="#F9CF30" position="0.5 -0.65 0"
                    material="shader: flat"></a-plane>
            </a-entity>

        </a-entity>
    </a-scene>

    <script>
        function captureHUD() {
            const video = document.querySelector('video');
            const sceneEl = document.querySelector('a-scene');

            if (!video || !sceneEl || !sceneEl.components.screenshot) return;

            const flash = document.getElementById('flash');
            flash.style.opacity = '1';
            setTimeout(() => { flash.style.opacity = '0'; }, 150);

            // Force synchronous render
            sceneEl.renderer.render(sceneEl.object3D, sceneEl.camera);
            const aframeCanvas = sceneEl.components.screenshot.getCanvas('perspective');
            if (!aframeCanvas) return;

            // Simplified capture logic. Rear camera means no mirroring, no flipping. 
            // We just grab the raw video and layer the raw AR canvas directly on top.
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');

            // Draw Video
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            // Draw AR
            ctx.drawImage(aframeCanvas, 0, 0, canvas.width, canvas.height);

            const link = document.createElement('a');
            link.download = 'TapFolio-Card-Scan.png';
            link.href = canvas.toDataURL('image/png', 1.0);
            link.click();
        }
    </script>
</body>

</html>
