<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>TapFolio | Cyber-HUD</title>

    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-face-aframe.prod.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent;
        }

        /* MANDATORY MINDAR STRUCTURE: The container that holds the scene */
        #example-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* FIX: MindAR injects a raw <video> element. We center it with object-fit: cover
           to fill the screen. We also re-apply scaleX(-1) here because our !important
           rule overrides MindAR's own mirror transform — without it, the video appears
           un-mirrored but MindAR's 3D coordinate space is still in mirrored space,
           causing the HUD to track in the opposite X direction to the face. */
        #example-container video {
            position: absolute !important;
            top: 50% !important;
            left: 50% !important;
            width: auto !important;
            height: auto !important;
            min-width: 100% !important;
            min-height: 100% !important;
            transform: translate(-50%, -50%) scaleX(-1) !important;
            object-fit: cover;
        }

        /* The three.js/A-Frame canvas (the HUD layer) should always match
           the container exactly so it lines up with the cropped video. */
        #example-container canvas {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            z-index: 999;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem 1.5rem;
        }

        .brutalist-btn {
            pointer-events: auto;
            background: #F9CF30;
            color: #111111;
            border: 2px solid #111111;
            box-shadow: 4px 4px 0px 0px #111111;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            text-transform: uppercase;
            padding: 1rem;
            text-align: center;
            transition: all 0.1s;
        }

        .brutalist-btn:active {
            transform: translate(4px, 4px);
            box-shadow: none;
        }
    </style>
</head>

<body>

    <div id="ui-layer">
        <div class="flex justify-between items-start">
            <a href="index.html" class="brutalist-btn" style="padding: 0.5rem 1rem; background: #FFFFFF;">&lt; BACK</a>

            <div class="flex gap-2">
                <div
                    class="text-xs font-mono font-bold text-white bg-black px-2 py-1 border border-[#F9CF30] flex items-center gap-2">
                    REC <span class="animate-pulse text-red-500">&#9679;</span>
                </div>
            </div>
        </div>

        <div class="text-center">
            <button onclick="captureHUD()" class="brutalist-btn w-full max-w-sm mx-auto">
                [ CAPTURE HUD RECORD ]
            </button>
            <p class="text-[#F9CF30] font-mono text-xs mt-3 font-bold bg-black/50 inline-block px-2"
                id="cam-instruction">
                SELFIE MODE ALIGNED
            </p>
        </div>
    </div>

    <div id="flash"
        class="fixed inset-0 bg-white opacity-0 z-[1000] pointer-events-none transition-opacity duration-150"></div>

    <div id="example-container">
        <script>
            // Always use the front camera with NO facingMode parameter.
            // Omitting facingMode lets MindAR use its own default mirroring logic
            // so the 3D coordinate space matches the mirrored video correctly.
            document.write(
                '<a-scene mindar-face embedded color-space="sRGB" ' +
                'renderer="colorManagement: true; preserveDrawingBuffer: true; alpha: true;" ' +
                'vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">'
            );
        </script>

        <a-camera active="false" position="0 0 0"></a-camera>

        <!--
            anchorIndex 168 = nose bridge / mid-face center.
            This is a stable anchor so the HUD frames the face correctly.
            anchorIndex 1 (nose tip) caused the overlay to sit above the head
            because Y offsets were measured from a point lower on the face.

            MindAR face-space coordinates (units roughly = face width):
              +Y = up,  -Y = down,  +X = right,  -X = left
        -->
        <a-entity mindar-face-target="anchorIndex: 168">

            <!-- CORNER BRACKETS: very slim ticks at the outer face edge only.
                 They sit just outside the face bounding box so they never
                 overlap skin or features. Tick arm length = 0.08 units. -->

            <!-- top-left -->
            <a-entity position="-0.32 0.28 0">
                <a-plane width="0.08" height="0.006" color="#F9CF30" position="0.04 0 0"
                    material="shader: flat"></a-plane>
                <a-plane width="0.006" height="0.08" color="#F9CF30" position="0 -0.04 0"
                    material="shader: flat"></a-plane>
            </a-entity>
            <!-- top-right -->
            <a-entity position="0.32 0.28 0">
                <a-plane width="0.08" height="0.006" color="#F9CF30" position="-0.04 0 0"
                    material="shader: flat"></a-plane>
                <a-plane width="0.006" height="0.08" color="#F9CF30" position="0 -0.04 0"
                    material="shader: flat"></a-plane>
            </a-entity>
            <!-- bottom-left -->
            <a-entity position="-0.32 -0.28 0">
                <a-plane width="0.08" height="0.006" color="#F9CF30" position="0.04 0 0"
                    material="shader: flat"></a-plane>
                <a-plane width="0.006" height="0.08" color="#F9CF30" position="0 0.04 0"
                    material="shader: flat"></a-plane>
            </a-entity>
            <!-- bottom-right -->
            <a-entity position="0.32 -0.28 0">
                <a-plane width="0.08" height="0.006" color="#F9CF30" position="-0.04 0 0"
                    material="shader: flat"></a-plane>
                <a-plane width="0.006" height="0.08" color="#F9CF30" position="0 0.04 0"
                    material="shader: flat"></a-plane>
            </a-entity>

            <!-- INFO CARD: positioned below the chin (y = -0.72) so it never
                 touches the face. A thin connector line bridges the gap. -->

            <!-- Connector line from bottom bracket down to card -->
            <a-plane width="0.004" height="0.26" color="#F9CF30" position="0 -0.52 0.01"
                material="shader: flat; transparent: true; opacity: 0.6"></a-plane>

            <!-- Info card -->
            <a-entity position="0 -0.72 0.02">

                <!-- Top gold accent bar -->
                <a-plane width="1.10" height="0.006" color="#F9CF30" position="0 0.175 0"
                    material="shader: flat"></a-plane>

                <!-- Dark semi-transparent backing -->
                <a-plane width="1.10" height="0.34" color="#000000" position="0 0 -0.005"
                    material="shader: flat; transparent: true; opacity: 0.72"></a-plane>

                <!-- Left section: Identity (gold) -->
                <a-text value="ERMAAN SINGH&#10;TAPFOLIO FOUNDER" color="#F9CF30" align="left" width="0.82"
                    wrap-count="24" position="-0.50 0.08 0" font="monoid" material="shader: flat"></a-text>

                <!-- Vertical divider -->
                <a-plane width="0.004" height="0.22" color="#F9CF30" position="0.08 0 0"
                    material="shader: flat; transparent: true; opacity: 0.5"></a-plane>

                <!-- Right section: Skills (white) -->
                <a-text value="API SECURITY | C++ " color="#FFFFFF" align="left" width="0.76" wrap-count="24"
                    position="0.12 0.08 0" font="monoid" material="shader: flat"></a-text>

                <!-- Bottom metadata row (grey) -->
                <a-text value="4.0 GPA  //  ROLE : STUDENT  //  CYBERSECURITY" color="#888888" align="center"
                    width="0.88" wrap-count="34" position="0 -0.12 0" font="monoid" material="shader: flat"></a-text>

                <!-- Bottom border strip -->
                <a-plane width="1.10" height="0.004" color="#333333" position="0 -0.172 0"
                    material="shader: flat"></a-plane>

            </a-entity>

        </a-entity>
        </a-scene>
    </div> <!-- End wrapper div -->

    <script>
        let arReady = false;

        // No camera switching — front camera only.
        // The scaleX(-1) on the video CSS rule ensures the display is mirrored
        // (natural selfie view) and MindAR's 3D tracking space matches it.

        window.addEventListener('DOMContentLoaded', () => {
            const sceneEl = document.querySelector('a-scene');

            const onReady = () => { arReady = true; };

            if (sceneEl.hasLoaded) {
                onReady();
            } else {
                sceneEl.addEventListener('loaded', onReady);
            }

            sceneEl.addEventListener('arReady', () => { arReady = true; });
        });

        function captureHUD() {
            const video = document.querySelector('#example-container video');
            const sceneEl = document.querySelector('a-scene');

            if (!video || !sceneEl || !sceneEl.components.screenshot) return;

            const flash = document.getElementById('flash');
            flash.style.opacity = '1';
            setTimeout(() => { flash.style.opacity = '0'; }, 150);

            sceneEl.renderer.render(sceneEl.object3D, sceneEl.camera);
            const aframeCanvas = sceneEl.components.screenshot.getCanvas('perspective');
            if (!aframeCanvas) return;

            const rect = document.getElementById('example-container').getBoundingClientRect();
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            const finalCanvas = document.createElement('canvas');
            finalCanvas.width = Math.round(rect.width * dpr);
            finalCanvas.height = Math.round(rect.height * dpr);
            const ctx = finalCanvas.getContext('2d');

            const isSelfie = (currentCam === 'user');

            const vw = video.videoWidth || 1280;
            const vh = video.videoHeight || 720;
            const cw = finalCanvas.width;
            const ch = finalCanvas.height;
            const videoRatio = vw / vh;
            const canvasRatio = cw / ch;

            let sx, sy, sw, sh;
            if (videoRatio > canvasRatio) {
                sh = vh;
                sw = vh * canvasRatio;
                sx = (vw - sw) / 2;
                sy = 0;
            } else {
                sw = vw;
                sh = vw / canvasRatio;
                sx = 0;
                sy = (vh - sh) / 2;
            }

            ctx.save();
            // Always selfie mode — flip canvas so the saved image is un-mirrored
            // (the CSS scaleX(-1) on the video is display-only; raw pixels are un-flipped).
            ctx.translate(cw, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, sx, sy, sw, sh, 0, 0, cw, ch);
            ctx.restore();

            ctx.drawImage(aframeCanvas, 0, 0, cw, ch);

            const link = document.createElement('a');
            link.download = 'TapFolio-Record.png';
            link.href = finalCanvas.toDataURL('image/png', 1.0);
            link.click();
        }
    </script>
</body>

</html>
